<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B3A40">
<title>Triage Session · Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A2E; --paper:#0A2E33; --paper-raised:#0F3A40; --line:#1C4D53;
    --teal:#1B8A93; --teal-deep:#0A2E33; --teal-soft:#12525A;
    --l1:#E15850; --l2:#F0994A; --l3:#EFC13B; --l4:#4FB37E; --l5:#5A9BC9;
    --gold:#F0C24B; --silver:#C9CFD6; --bronze:#D89A5E;
  }
  *{box-sizing:border-box;}
  body{margin:0; font-family:'IBM Plex Sans Thai','IBM Plex Sans',-apple-system,sans-serif;
    background:var(--paper); color:#fff; min-height:100vh;}
  .wrap{max-width:1400px; margin:0 auto; padding:28px 36px 40px;}
  .entry-wrap{max-width:480px; margin:80px auto; padding:0 20px;}
  .entry-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:20px; padding:36px;}
  .entry-card h1{font-size:22px; margin:0 0 18px; font-weight:700;}
  input[type=text]{width:100%; padding:16px 18px; border:2px solid var(--line); border-radius:12px;
    font-size:20px; margin-bottom:16px; background:var(--paper); color:#fff; text-transform:uppercase; letter-spacing:.08em;}
  input::placeholder{color:#7FA8AC;}
  button.enter{background:var(--teal); color:#fff; border:none; border-radius:12px; padding:16px 20px;
    font-size:18px; font-weight:700; cursor:pointer; width:100%;}
  .errtag{color:var(--l1); font-size:14px; margin:-8px 0 14px;}

  .topbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:28px;}
  .roomtitle{font-size:26px; font-weight:800;}
  .roomcode{font-size:16px; color:#8FC7CC; font-weight:600; letter-spacing:.05em;}
  .live-pill{display:flex; align-items:center; gap:8px; background:var(--paper-raised); padding:8px 18px;
    border-radius:30px; border:1px solid var(--line); font-size:14px; font-weight:700;}
  .live-dot{width:10px; height:10px; border-radius:50%; background:var(--l4); animation:pulse 1.6s infinite;}
  @keyframes pulse{0%,100%{opacity:1;} 50%{opacity:.35;}}

  .statusband{text-align:center; padding:80px 20px; font-size:34px; font-weight:800; color:#B9D8DB;}
  .statusband .sub{font-size:18px; font-weight:500; color:#7FA8AC; margin-top:10px;}

  .stat-row{display:grid; grid-template-columns:repeat(3,1fr); gap:20px; margin-bottom:28px;}
  .stat-card{background:var(--paper-raised); border:1px solid var(--line); border-radius:18px; padding:26px; text-align:center;}
  .stat-card .num{font-size:56px; font-weight:800; line-height:1.1;}
  .stat-card .lab{font-size:15px; color:#8FC7CC; margin-top:8px; font-weight:600;}

  .board{background:var(--paper-raised); border:1px solid var(--line); border-radius:20px; overflow:hidden;}
  .board-head{display:grid; grid-template-columns:70px 1fr 140px 160px; padding:16px 26px; font-size:14px;
    color:#8FC7CC; font-weight:700; text-transform:uppercase; letter-spacing:.04em; border-bottom:1px solid var(--line);}
  .row{display:grid; grid-template-columns:70px 1fr 140px 160px; align-items:center; padding:16px 26px;
    font-size:22px; border-bottom:1px solid var(--line); transition:background .2s;}
  .row:last-child{border-bottom:none;}
  .row.top1{background:linear-gradient(90deg, rgba(240,194,75,.16), transparent);}
  .row.top2{background:linear-gradient(90deg, rgba(201,207,214,.12), transparent);}
  .row.top3{background:linear-gradient(90deg, rgba(216,154,94,.12), transparent);}
  .rank{font-weight:800; font-size:24px; color:#8FC7CC;}
  .rank.medal{font-size:30px;}
  .rname{font-weight:700;}
  .rdept{font-size:15px; color:#8FC7CC; font-weight:400; margin-top:2px;}
  .rscore{font-weight:800; text-align:right; padding-right:20px;}
  .rprogress{text-align:right; color:#8FC7CC; font-size:16px;}
  .rprogress .bar{display:inline-block; width:100px; height:8px; background:var(--paper); border-radius:5px; overflow:hidden; vertical-align:middle; margin-right:8px;}
  .rprogress .fill{height:100%; background:var(--teal); border-radius:5px;}
  .empty-row{padding:60px; text-align:center; color:#7FA8AC; font-size:20px;}

  .podium-wrap{display:flex; align-items:flex-end; justify-content:center; gap:24px; margin:20px 0 36px; flex-wrap:wrap;}
  .podium-col{display:flex; flex-direction:column; align-items:center; width:220px;}
  .podium-medal{font-size:44px; margin-bottom:8px;}
  .podium-name{font-size:22px; font-weight:800; text-align:center; margin-bottom:2px; max-width:210px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .podium-dept{font-size:14px; color:#8FC7CC; margin-bottom:8px; text-align:center;}
  .podium-score{font-size:30px; font-weight:800; margin-bottom:14px;}
  .podium-bar{width:100%; border-radius:16px 16px 0 0; display:flex; align-items:flex-start; justify-content:center;
    padding-top:16px; font-size:38px; font-weight:800; color:rgba(10,46,51,.55);}
  .podium-bar.gold{height:210px; background:linear-gradient(180deg,#F7D678,var(--gold));}
  .podium-bar.silver{height:160px; background:linear-gradient(180deg,#E4E9ED,var(--silver));}
  .podium-bar.bronze{height:120px; background:linear-gradient(180deg,#E9B98A,var(--bronze));}
  .ended-banner{text-align:center; padding:24px 20px 4px; font-size:32px; font-weight:800; color:#F0C24B;}

  .participant-panel{background:var(--paper-raised); border:1px solid var(--line); border-radius:20px; overflow:hidden; margin-top:20px;}
  .participant-head{display:flex; justify-content:space-between; align-items:center; padding:16px 22px; border-bottom:1px solid var(--line);}
  .participant-head .title{font-size:18px; font-weight:800;}
  .participant-head .count{font-size:14px; color:#8FC7CC; font-weight:700;}
  .participant-list{display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:0;}
  .participant-item{padding:14px 20px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; min-width:0;}
  .participant-dot{width:9px; height:9px; border-radius:50%; background:var(--l4); flex-shrink:0;}
  .participant-name{font-size:17px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .participant-dept{font-size:12px; color:#8FC7CC; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .participant-empty{padding:30px 20px; text-align:center; color:#7FA8AC;}
  .participant-item{animation:participantIn .3s ease both;transition:background .2s,transform .2s;}
  .participant-item:hover{background:rgba(18,82,90,.05);transform:translateX(2px);}
  @keyframes participantIn{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}
  .participant-dot{animation:participantPulse 1.8s ease-in-out infinite;}
  @keyframes participantPulse{0%,100%{box-shadow:0 0 0 0 rgba(63,145,99,.25)}50%{box-shadow:0 0 0 5px rgba(63,145,99,0)}}

  @media (max-width:900px){.participant-list{grid-template-columns:repeat(2,minmax(0,1fr));}}
  @media (max-width:600px){.wrap{padding:20px 16px 30px;}.participant-list{grid-template-columns:1fr;}.participant-name{font-size:16px;}.stat-row{grid-template-columns:1fr;}}
</style>
</head>
<body>
<div id="root"><div class="entry-wrap"><div class="entry-card"><h1>กำลังเตรียมระบบ...</h1></div></div></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, collection, query, where, getDocs, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDNO-XsILUd4_Wm6WPiJUCd4t032GYAzx4",
  authDomain: "lecturebymyself-44dd8.firebaseapp.com",
  projectId: "lecturebymyself-44dd8",
  storageBucket: "lecturebymyself-44dd8.firebasestorage.app",
  messagingSenderId: "633622263197",
  appId: "1:633622263197:web:58dd3900599a34e2b12b74",
  measurementId: "G-BEW4ZE5WSR"
};
// ตั้งชื่อ app instance แยกจากหน้าอื่น กัน Auth session ชนกันข้ามแท็บ
const fbApp = initializeApp(firebaseConfig, "dashboard");
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const root = document.getElementById('root');
let classroomId = null, classroom = null, students = [];
let questionCache = {};
let unsubRoom = null, unsubStudents = null;
const DASHBOARD_SESSION_KEY = 'erTriageSession_dashboard_v2';
function saveDashboardSession(){
  if(!classroomId || !classroom?.code) return;
  localStorage.setItem(DASHBOARD_SESSION_KEY, JSON.stringify({version:2, role:'dashboard', classroomId, code:classroom.code, savedAt:Date.now()}));
}
function clearDashboardSession(){ localStorage.removeItem(DASHBOARD_SESSION_KEY); }
async function restoreDashboardSession(){
  try{
    const raw = localStorage.getItem(DASHBOARD_SESSION_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(saved?.role !== 'dashboard' || saved?.version !== 2 || !saved.classroomId) return false;
    const snap = await getDoc(doc(db,'classrooms',saved.classroomId));
    if(!snap.exists()){ clearDashboardSession(); return false; }
    classroomId = saved.classroomId;
    subscribeDashboard();
    return true;
  }catch(e){ console.warn('Could not restore dashboard session:', e); return false; }
}
function subscribeDashboard(){
  if(unsubRoom) unsubRoom(); if(unsubStudents) unsubStudents();
  unsubRoom = onSnapshot(doc(db,'classrooms',classroomId), (s)=>{
    if(!s.exists()){ clearDashboardSession(); classroom=null; renderEntry(); return; }
    classroom = { id:classroomId, ...s.data() };
    saveDashboardSession();
    renderDashboard();
  });
  unsubStudents = onSnapshot(collection(db,'classrooms',classroomId,'students'), (s)=>{
    students = []; s.forEach(d=>students.push({ id:d.id, ...d.data() }));
    renderDashboard();
  });
}

async function getQuestion(topicId, qid){
  if(questionCache[qid]) return questionCache[qid];
  try{
    const snap = await getDoc(doc(db,'question_bank',topicId,'questions',qid));
    if(snap.exists()){ questionCache[qid] = { id:qid, ...snap.data() }; return questionCache[qid]; }
  }catch(e){}
  return { correct:0 };
}
async function ensureQuestionsCached(ids, topicId){
  for(const qid of ids){ if(!questionCache[qid]) await getQuestion(topicId, qid); }
}
function scoreStudent(s, phase, ids){
  const field = phase==='pretest' ? 'pretestAnswers' : 'posttestAnswers';
  const submittedField = phase==='pretest' ? 'pretestSubmittedAt' : 'posttestSubmittedAt';
  // เช่นเดียวกับหน้า presenter: ต้องรอ submittedAt ก่อน ไม่งั้นจอใหญ่จะโชว์คะแนน/อันดับ
  // ที่ยังทำไม่เสร็จ ทำให้คนอื่นเห็นคำตอบที่ยังไม่ได้ตั้งใจส่งจริง
  if(!s[submittedField]) return { correct:0, answered:0 };
  const ans = s[field] || {};
  let correct=0, answered=0;
  ids.forEach(qid=>{
    if(ans[qid]===undefined) return;
    answered++;
    if(questionCache[qid] && ans[qid]===questionCache[qid].correct) correct++;
  });
  return { correct, answered };
}

setPersistence(auth, browserLocalPersistence).then(async ()=>{
  onAuthStateChanged(auth, async (user)=>{ if(user){ const restored = await restoreDashboardSession(); if(!restored) renderEntry(); } });
  signInAnonymously(auth).catch(err=>{
    root.innerHTML = `<div class="entry-wrap"><div class="entry-card"><h1>เชื่อมต่อไม่สำเร็จ: ${err.message}</h1></div></div>`;
  });
});

function renderEntry(){
  const urlCode = new URLSearchParams(location.search).get('code');
  root.innerHTML = `
    <div class="entry-wrap">
      <div class="entry-card">
        <h1>เปิด Dashboard สำหรับ Classroom</h1>
        <input type="text" id="codeInput" placeholder="รหัส Classroom เช่น A7K2P" value="${urlCode||''}">
        <div class="errtag" id="err" style="display:none;"></div>
        <button class="enter" id="goBtn">เปิด Dashboard</button>
      </div>
    </div>
  `;
  document.getElementById('goBtn').addEventListener('click', joinDashboard);
  document.getElementById('codeInput').addEventListener('keydown', (e)=>{ if(e.key==='Enter') joinDashboard(); });
  if(urlCode) joinDashboard();
}

async function joinDashboard(){
  const code = document.getElementById('codeInput').value.trim().toUpperCase();
  const err = document.getElementById('err');
  if(!code){ err.textContent='กรุณากรอกรหัส Classroom'; err.style.display='block'; return; }
  const snap = await getDocs(query(collection(db,'classrooms'), where('code','==',code)));
  if(snap.empty){ err.textContent='ไม่พบ Classroom นี้'; err.style.display='block'; return; }
  classroomId = snap.docs[0].id;
  saveDashboardSession();
  subscribeDashboard();
}

function renderParticipantPanel(){
  const sorted = [...students].sort((a,b)=> (a.name||'').localeCompare(b.name||'', 'th'));
  const rows = sorted.map(s=>`
    <div class="participant-item">
      <span class="participant-dot"></span>
      <div style="min-width:0;">
        <div class="participant-name">${s.name || 'ไม่ระบุชื่อ'}</div>
        ${s.dept ? `<div class="participant-dept">${s.dept}</div>` : ''}
      </div>
    </div>
  `).join('');
  return `
    <div class="participant-panel">
      <div class="participant-head">
        <div class="title">ผู้เข้าร่วมที่อยู่ในห้อง</div>
        <div class="count">${students.length} คน</div>
      </div>
      ${rows ? `<div class="participant-list">${rows}</div>` : `<div class="participant-empty">ยังไม่มีผู้เข้าร่วม</div>`}
    </div>
  `;
}

async function renderDashboard(){
  if(!classroom) return;
  const mode = classroom.mode || 'lobby';
  const n = students.length;

  const header = `
    <div class="topbar">
      <div>
        <div class="roomtitle">${classroom.name}</div>
        <div class="roomcode">รหัส ${classroom.code}</div>
      </div>
      <div style="display:flex; align-items:center; gap:10px;">
        <div class="live-pill"><span class="live-dot"></span> LIVE</div>
        <button id="exitDashBtn" style="background:var(--paper-raised); color:#fff; border:1px solid var(--line);
          border-radius:10px; padding:10px 16px; font-size:14px; font-weight:700; cursor:pointer;">ออก / เปลี่ยนห้อง</button>
      </div>
    </div>
  `;

  function bindExitBtn(){
    const btn = document.getElementById('exitDashBtn');
    if(btn) btn.addEventListener('click', exitDashboard);
  }

  if(mode === 'lobby'){
    root.innerHTML = `<div class="wrap">${header}
      <div class="stat-row"><div class="stat-card" style="grid-column:1/-1;"><div class="num">${n}</div><div class="lab">ผู้เข้าร่วมทั้งหมด</div></div></div>
      <div class="statusband">รอผู้บรรยายเริ่มกิจกรรม<div class="sub">แชร์รหัส ${classroom.code} ให้ผู้เข้าร่วมกรอกเข้าห้องได้เลย</div></div>
      ${renderParticipantPanel()}
    </div>`;
    bindExitBtn();
    return;
  }
  if(mode === 'lecture'){
    root.innerHTML = `<div class="wrap">${header}
      <div class="stat-row"><div class="stat-card" style="grid-column:1/-1;"><div class="num">${n}</div><div class="lab">ผู้เข้าร่วมทั้งหมด</div></div></div>
      <div class="statusband">🎤 กำลังบรรยาย</div>
      ${renderParticipantPanel()}
    </div>`;
    bindExitBtn();
    return;
  }
  if(mode === 'ended'){
    return renderEndedScreen(header, n);
  }
  if(mode === 'pretest' || mode === 'posttest'){
    return renderLeaderboard(header, n, mode, mode==='pretest' ? 'Pretest — คะแนนสด' : 'Post-test — คะแนนสด');
  }
  root.innerHTML = `<div class="wrap">${header}<div class="statusband">กำลังโหลด...</div></div>`;
  bindExitBtn();
}

function exitDashboard(){
  if(unsubRoom) unsubRoom();
  if(unsubStudents) unsubStudents();
  unsubRoom = null; unsubStudents = null;
  classroom = null; classroomId = null; students = [];
  try{ clearDashboardSession(); }catch(e){}
  renderEntry();
}

async function renderEndedScreen(header, n){
  const preIds = classroom.pretestQuestionIds, postIds = classroom.posttestQuestionIds;
  await ensureQuestionsCached(preIds, classroom.pretestTopicId);
  await ensureQuestionsCached(postIds, classroom.posttestTopicId);

  const combined = students.map(s=>{
    const pre = scoreStudent(s, 'pretest', preIds);
    const post = scoreStudent(s, 'posttest', postIds);
    return {
      name: s.name, dept: s.dept,
      preSubmitted: !!s.pretestSubmittedAt, postSubmitted: !!s.posttestSubmittedAt,
      pre: pre.correct, post: post.correct
    };
  });

  // Top 3 จัดอันดับจากคะแนน Post-test (เฉพาะคนที่ส่งจริงแล้ว)
  const top3 = combined.filter(c => c.postSubmitted).sort((a,b) => b.post - a.post).slice(0, 3);

  // Most Improved: ต้องทำครบทั้ง Pre และ Post ถึงจะเทียบพัฒนาการได้
  const improved = combined
    .filter(c => c.preSubmitted && c.postSubmitted)
    .map(c => ({ ...c, delta: c.post - c.pre }))
    .sort((a,b) => b.delta - a.delta);
  const mostImproved = improved.length ? improved[0] : null;

  const podiumOrder = top3.length === 3 ? [top3[1], top3[0], top3[2]]
    : top3.length === 2 ? [top3[1], top3[0]]
    : top3;
  const podiumClass = ['silver','gold','bronze'];
  const podiumMedal = ['🥈','🥇','🥉'];
  // จัดตำแหน่ง class/medal ให้ตรงกับอันดับจริงของแต่ละคนใน podiumOrder เทียบกับ top3 เดิม
  const classFor = (person) => podiumClass[top3.indexOf(person)];
  const medalFor = (person) => podiumMedal[top3.indexOf(person)];

  const podiumHtml = podiumOrder.length ? `
    <div class="podium-wrap">
      ${podiumOrder.map(p => `
        <div class="podium-col">
          <div class="podium-medal">${medalFor(p)}</div>
          <div class="podium-name">${p.name}</div>
          ${p.dept ? `<div class="podium-dept">${p.dept}</div>` : ''}
          <div class="podium-score">${p.post}/${postIds.length}</div>
          <div class="podium-bar ${classFor(p)}"></div>
        </div>
      `).join('')}
    </div>
  ` : `<div class="statusband" style="padding:30px 20px;">ยังไม่มีผู้ส่ง Post-test</div>`;

  const awardHtml = mostImproved ? `
    <div style="text-align:center; margin-top:8px;">
      <div style="font-size:20px; font-weight:800; color:var(--gold); margin-bottom:16px;">⭐ รางวัลพัฒนาการยอดเยี่ยม (Most Improved) ⭐</div>
      <div class="stat-card" style="max-width:440px; margin:0 auto; padding:30px;">
        <div class="num" style="font-size:32px;">${mostImproved.name}</div>
        <div class="lab" style="font-size:15px; margin-top:4px;">${mostImproved.dept || ''}</div>
        <div style="font-size:28px; font-weight:800; color:#4FB37E; margin-top:14px;">+${mostImproved.delta} คะแนน</div>
        <div class="lab" style="margin-top:6px;">Pretest ${mostImproved.pre}/${preIds.length} → Post-test ${mostImproved.post}/${postIds.length}</div>
      </div>
    </div>
  ` : `<div class="small-muted" style="text-align:center; margin-top:20px;">ยังไม่มีใครทำครบทั้ง Pretest และ Post-test เพื่อเทียบพัฒนาการ</div>`;

  root.innerHTML = `
    <div class="wrap">
      ${header}
      <div class="ended-banner">🎉 จบการนำเสนอแล้ว</div>
      <div class="stat-row" style="margin-top:20px;">
        <div class="stat-card" style="grid-column:1/-1;"><div class="num">${n}</div><div class="lab">ผู้เข้าร่วมทั้งหมด</div></div>
      </div>
      ${podiumHtml}
      ${awardHtml}
      ${renderParticipantPanel()}
    </div>
  `;
  const exitBtn = document.getElementById('exitDashBtn');
  if(exitBtn) exitBtn.addEventListener('click', exitDashboard);
}

async function renderLeaderboard(header, n, phase, title){
  const ids = phase==='pretest' ? classroom.pretestQuestionIds : classroom.posttestQuestionIds;
  const topicId = phase==='pretest' ? classroom.pretestTopicId : classroom.posttestTopicId;
  await ensureQuestionsCached(ids, topicId);

  const results = students.map(s=>{
    const { correct, answered } = scoreStudent(s, phase, ids);
    return { name:s.name, dept:s.dept, correct, answered };
  }).sort((a,b)=> b.correct-a.correct || b.answered-a.answered);

  const finished = results.filter(r=>r.answered===ids.length).length;
  const avgScore = results.length ? (results.reduce((s,r)=>s+r.correct,0)/results.length) : 0;

  const medals = ['🥇','🥈','🥉'];
  const rows = results.map((r,i)=>{
    const pct = ids.length ? Math.round((r.answered/ids.length)*100) : 0;
    const topClass = i<3 ? `top${i+1}` : '';
    return `
      <div class="row ${topClass}">
        <div class="rank ${i<3?'medal':''}">${i<3 ? medals[i] : (i+1)}</div>
        <div>
          <div class="rname">${r.name}</div>
          ${r.dept ? `<div class="rdept">${r.dept}</div>` : ''}
        </div>
        <div class="rscore">${r.correct}/${ids.length}</div>
        <div class="rprogress"><span class="bar"><span class="fill" style="width:${pct}%;"></span></span>${r.answered}/${ids.length}</div>
      </div>
    `;
  }).join('');

  root.innerHTML = `
    <div class="wrap">
      ${header}
      <div class="stat-row">
        <div class="stat-card"><div class="num">${n}</div><div class="lab">เข้าร่วมทั้งหมด</div></div>
        <div class="stat-card"><div class="num">${finished}/${n}</div><div class="lab">ทำเสร็จแล้ว</div></div>
        <div class="stat-card"><div class="num">${avgScore.toFixed(1)}</div><div class="lab">คะแนนเฉลี่ย / ${ids.length}</div></div>
      </div>
      <div class="board">
        <div class="board-head"><div>อันดับ</div><div>ชื่อ</div><div style="text-align:right; padding-right:20px;">คะแนน</div><div style="text-align:right;">ความคืบหน้า</div></div>
        ${rows || `<div class="empty-row">ยังไม่มีผู้เริ่มทำ</div>`}
      </div>
      ${renderParticipantPanel()}
    </div>
  `;
  const exitBtn = document.getElementById('exitDashBtn');
  if(exitBtn) exitBtn.addEventListener('click', exitDashboard);
}
</script>
</body>
</html>
