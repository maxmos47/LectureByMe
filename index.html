<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B3A40">
<title>Triage Session · เข้าร่วม</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A2E; --paper:#F5F4F0; --paper-raised:#FFFFFF; --line:#E3E6E2;
    --teal:#12525A; --teal-deep:#0A2E33; --teal-soft:#EAF3F2;
    --l1:#D6453D; --l2:#E8873A; --l3:#DDAE1F; --l4:#3F9163; --l5:#3E7FA6;
    --shadow-sm:0 1px 2px rgba(11,46,51,.05), 0 1px 3px rgba(11,46,51,.06);
    --shadow-md:0 4px 14px rgba(11,46,51,.08), 0 2px 4px rgba(11,46,51,.04);
    --radius-lg:18px; --radius-md:12px; --radius-sm:9px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; font-family:'IBM Plex Sans Thai','IBM Plex Sans',-apple-system,"Segoe UI",sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;}
  .app{max-width:520px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 48px); min-height:100vh;}
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .card{ animation:fadeInUp .28s ease both; }

  .topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 0 14px; margin:0 -16px 18px; padding-left:16px; padding-right:16px;
    background:var(--paper); border-bottom:1px solid var(--line);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .dot-logo{width:32px; height:32px; border-radius:10px; background:linear-gradient(145deg,var(--teal),var(--teal-deep));
    flex-shrink:0; box-shadow:var(--shadow-sm);}
  .brand .mark{font-size:11px; color:var(--teal); font-weight:700; letter-spacing:.04em;}
  .brand h1{font-size:17px; margin:1px 0 0; font-weight:700; color:var(--teal-deep); line-height:1.2;}
  .badge{font-size:11.5px; padding:5px 11px; border-radius:20px; background:var(--teal); color:#fff; display:none; font-weight:600;}

  .card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:20px; margin-bottom:14px; box-shadow:var(--shadow-sm);}
  .lead{font-size:14.5px; color:#4A5754; margin:0 0 16px; line-height:1.65;}
  label{display:block; font-size:13px; font-weight:600; color:var(--teal-deep); margin-bottom:7px;}
  input[type=text]{width:100%; padding:13px 14px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    font-size:16px; margin-bottom:14px; background:var(--paper); color:var(--ink); transition:border-color .15s;}
  input:focus{outline:none; border-color:var(--teal);}
  #codeInput{text-transform:uppercase; letter-spacing:.06em; font-weight:600;}
  button{-webkit-tap-highlight-color:transparent;}
  button.primary{background:var(--teal); color:#fff; border:none; border-radius:var(--radius-sm); padding:14px 18px;
    font-size:15.5px; font-weight:600; cursor:pointer; width:100%; min-height:50px; box-shadow:var(--shadow-sm);
    transition:transform .08s, background .15s;}
  @media (hover:hover){ button.primary:hover{background:var(--teal-deep);} }
  button.primary:active{transform:scale(.98);}
  button.primary:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  button.ghost{background:var(--paper-raised); color:var(--teal); border:1.5px solid var(--teal); border-radius:var(--radius-sm);
    padding:12px 16px; font-size:14px; cursor:pointer; min-height:46px; font-weight:600; transition:transform .08s, background .15s;}
  button.ghost:active{transform:scale(.98); background:var(--teal-soft);}
  .case-box{background:var(--teal-soft); border-left:4px solid var(--teal); border-radius:var(--radius-sm); padding:16px 17px;
    margin-bottom:16px; font-size:15.5px; line-height:1.65;}
  .option{display:flex; align-items:center; gap:12px; border:1.5px solid var(--line); border-radius:var(--radius-sm);
    padding:15px 16px; margin-bottom:10px; cursor:pointer; font-size:15px; background:var(--paper-raised);
    transition:border-color .15s, background .15s, transform .08s;}
  .option:active{transform:scale(.985);}
  .option.selected{border-color:var(--teal); background:var(--teal-soft); font-weight:600;}
  .dot{width:18px; height:18px; border-radius:50%; border:2px solid var(--line); flex-shrink:0; transition:border-color .15s, background .15s;}
  .option.selected .dot{border-color:var(--teal); background:var(--teal); box-shadow:inset 0 0 0 3px #fff;}
  .linkbtn{display:block; width:100%; text-align:center; background:none; border:none; color:var(--teal);
    font-size:13.5px; padding:14px 10px 4px; cursor:pointer; font-weight:600;}
  .swatch{width:11px; height:11px; border-radius:50%; flex-shrink:0;}
  .status-box{text-align:center; padding:40px 14px; color:#6B7674; font-size:15px;}
  .status-box .big{font-size:19px; color:var(--teal-deep); font-weight:700; margin-bottom:8px;}
  .qtag{font-size:12px; font-weight:700; color:var(--teal); margin-bottom:6px; letter-spacing:.02em;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
  .stat-box{background:var(--paper); border-radius:var(--radius-md); padding:16px 12px; text-align:center;}
  .stat-box .num{font-size:25px; font-weight:700; color:var(--teal-deep); line-height:1.2;}
  .stat-box .lab{font-size:11.5px; color:#6B7674; margin-top:3px; font-weight:500;}
  .delta-up{color:var(--l4);} .delta-down{color:var(--l1);} .delta-flat{color:#8A9391;}
  .error-text{color:var(--l1); font-size:13px; margin:-8px 0 12px;}
  .nav-row{display:flex; gap:10px; margin-top:14px;} .nav-row > *{flex:1;}
  .small-muted{font-size:12px; color:#8A9391; margin-top:12px; text-align:center; line-height:1.5;}
  .celebrate{width:64px; height:64px; border-radius:50%; background:linear-gradient(145deg,var(--teal),var(--teal-deep));
    margin:0 auto 16px; display:flex; align-items:center; justify-content:center; font-size:28px; box-shadow:var(--shadow-md);}
  .quiz-progress{height:7px;background:var(--line);border-radius:999px;overflow:hidden;margin:8px 0 18px;}
  .quiz-progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#4F9AA1);border-radius:999px;transition:width .35s ease;}
  .option{box-shadow:0 1px 2px rgba(11,46,51,.03);}
  .option.selected{animation:optionPop .22s ease;}
  @keyframes optionPop{0%{transform:scale(.985)}60%{transform:scale(1.012)}100%{transform:scale(1)}}
  .status-box .big{animation:softAppear .35s ease;}
  @keyframes softAppear{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:translateY(0)}}

  .topbar-actions{display:flex;align-items:center;gap:8px;min-width:0;}
  .room-chip{display:flex;align-items:center;gap:7px;background:linear-gradient(135deg,#fff,#eef7f5);border:1px solid #cfe0dd;border-radius:14px;padding:5px 6px 5px 10px;box-shadow:0 2px 8px rgba(11,46,51,.06);white-space:nowrap;}
  .room-chip-label{font-size:10px;color:#71807d;font-weight:600;}
  .room-chip strong{font-size:15px;letter-spacing:.12em;color:var(--teal-deep);font-weight:800;}
  .room-copy{border:0;background:var(--teal);color:#fff;border-radius:9px;padding:6px 8px;font:600 10.5px inherit;cursor:pointer;min-height:28px;}
  .room-copy:active{transform:scale(.96);}
  .join-hero{background:linear-gradient(145deg,var(--teal-deep),var(--teal));color:#fff;border:0;overflow:hidden;position:relative;}
  .join-hero:after{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-65px;top:-65px;background:rgba(255,255,255,.08);}
  .join-kicker{font-size:11px;font-weight:700;letter-spacing:.08em;opacity:.75;margin-bottom:5px;}
  .join-title{font-size:24px;line-height:1.25;font-weight:700;margin:0 0 7px;}
  .join-subtitle{font-size:13.5px;opacity:.84;margin:0;max-width:370px;}
  .join-form-card{margin-top:-2px;position:relative;z-index:2;}
  .field-wrap{margin-bottom:14px;}
  .field-wrap input[type=text]{margin-bottom:0;}
  .room-hint{display:flex;align-items:center;gap:8px;background:var(--teal-soft);border:1px solid #d5e7e4;border-radius:11px;padding:10px 12px;margin:0 0 16px;font-size:12px;color:#526360;}
  .room-hint-icon{width:24px;height:24px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:13px;flex:none;}
  .status-card{position:relative;overflow:hidden;}
  .status-card:before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:linear-gradient(var(--teal),#5ba5aa);}
  .status-icon{width:52px;height:52px;border-radius:16px;background:var(--teal-soft);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;font-size:23px;}
  .live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#4f9a68;box-shadow:0 0 0 5px rgba(79,154,104,.12);margin-right:7px;animation:pulseLive 1.8s infinite;}
  @keyframes pulseLive{0%,100%{opacity:1;box-shadow:0 0 0 4px rgba(79,154,104,.10)}50%{opacity:.65;box-shadow:0 0 0 7px rgba(79,154,104,.02)}}
  .participant-room-banner{display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(135deg,#fff,#f1f8f7);border:1px solid #d6e5e2;border-radius:14px;padding:11px 12px;margin-bottom:14px;box-shadow:var(--shadow-sm);}
  .participant-room-meta{font-size:11px;color:#74817f;}
  .participant-room-code{font-size:19px;font-weight:800;letter-spacing:.14em;color:var(--teal-deep);line-height:1.1;}
  .participant-room-share{border:0;background:var(--teal);color:#fff;border-radius:9px;padding:8px 10px;font:600 11px inherit;cursor:pointer;white-space:nowrap;}
  .leave-class-btn{border:1px solid #e3b8b8;background:#fff7f7;color:#b64242;border-radius:9px;padding:7px 10px;font:600 10.5px inherit;cursor:pointer;white-space:nowrap;transition:.15s ease;}
  .leave-class-btn:hover{background:#fff0f0;border-color:#d89494;}
  .leave-class-btn:active{transform:scale(.97);}
  @media (max-width:420px){
    .leave-class-btn{padding:6px 8px;font-size:10px;}
  }
  @media (max-width:420px){
    .topbar-actions .badge{display:none!important;}
    .room-chip{padding-left:8px;}
    .room-chip strong{font-size:13px;}
    .room-chip-label{display:none;}
    .join-title{font-size:22px;}
  }
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="dot-logo"></div>
      <div>
        <span class="mark">ER TRIAGE</span>
        <h1 id="titleText">เข้าร่วมการบรรยาย</h1>
      </div>
    </div>
    <div class="topbar-actions">
      <div class="room-chip" id="roomChip" style="display:none;">
        <span class="room-chip-label">ห้อง</span>
        <strong id="roomCodeDisplay">—</strong>
        <button type="button" class="room-copy" id="copyRoomBtn" aria-label="คัดลอกรหัสห้อง">คัดลอก</button>
      </div>
      <button type="button" class="leave-class-btn" id="leaveClassBtn" style="display:none;">ออกจาก Class</button>
      <span class="badge" id="roleBadge"></span>
    </div>
  </div>
  <div id="root"><div class="card"><div class="status-box">กำลังเตรียมระบบ...</div></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged, setPersistence, browserLocalPersistence, signOut
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, query, where, getDocs, onSnapshot
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDNO-XsILUd4_Wm6WPiJUCd4t032GYAzx4",
  authDomain: "lecturebymyself-44dd8.firebaseapp.com",
  projectId: "lecturebymyself-44dd8",
  storageBucket: "lecturebymyself-44dd8.firebasestorage.app",
  messagingSenderId: "633622263197",
  appId: "1:633622263197:web:58dd3900599a34e2b12b74",
  measurementId: "G-BEW4ZE5WSR"
};

// ตั้งชื่อ app instance แยกจากหน้าอื่น กัน Auth session ชนกันข้ามแท็บ
const fbApp = initializeApp(firebaseConfig, "participant");
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const OPTIONS_DEFAULT = ["Level 1 (แดง)","Level 2 (ส้ม)","Level 3 (เหลือง)","Level 4 (เขียว)","Level 5 (ขาว)"];
const LEVEL_COLORS = ["var(--l1)","var(--l2)","var(--l3)","var(--l4)","var(--l5)"];
const REGISTRY_UNUSED = null;

const root = document.getElementById('root');
const titleText = document.getElementById('titleText');
const roleBadge = document.getElementById('roleBadge');
const roomChip = document.getElementById('roomChip');
const roomCodeDisplay = document.getElementById('roomCodeDisplay');
const copyRoomBtn = document.getElementById('copyRoomBtn');
const leaveClassBtn = document.getElementById('leaveClassBtn');

let uid = null;
let myStudentId = null;
let classroomId = null;
let className = '';
let myName = '';
let myDept = '';
let classroom = null;
let unsubRoom = null;
let questionCache = {};

let showingMySummary = false;
let myAnswers = { pretestAnswers:{}, posttestAnswers:{} };
let preIdx = 0, postIdx = 0;
let preSubmitted = false, postSubmitted = false;

function swatch(i){ return `<span class="swatch" style="background:${LEVEL_COLORS[i]}"></span>`; }
function genId(){ return 'p_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8); }

function ctrlKeyUnused(){}

const PARTICIPANT_SESSION_KEY = 'erTriageSession_participant_v2';

function saveParticipantSession(){
  if(!classroomId || !myStudentId || !uid) return;
  localStorage.setItem(PARTICIPANT_SESSION_KEY, JSON.stringify({
    version: 2, role: 'participant',
    authUid: uid, classroomId, studentId: myStudentId,
    name: myName, dept: myDept,
    savedAt: Date.now()
  }));
}

function clearParticipantSession(){
  localStorage.removeItem(PARTICIPANT_SESSION_KEY);
  roomChip.style.display='none';
  leaveClassBtn.style.display='none';
  roleBadge.style.display='none';
}

function updateRoomCodeUI(){
  const code = classroom?.code || '';
  if(!code){ roomChip.style.display='none'; return; }
  roomCodeDisplay.textContent = code;
  roomChip.style.display='flex';
  leaveClassBtn.style.display='inline-flex';
}

async function copyRoomCode(){
  const code = classroom?.code || '';
  if(!code) return;
  try{
    await navigator.clipboard.writeText(code);
    const old = copyRoomBtn.textContent;
    copyRoomBtn.textContent='คัดลอกแล้ว';
    setTimeout(()=>copyRoomBtn.textContent=old,1400);
  }catch(e){
    const ta=document.createElement('textarea');
    ta.value=code; document.body.appendChild(ta); ta.select();
    try{ document.execCommand('copy'); copyRoomBtn.textContent='คัดลอกแล้ว'; setTimeout(()=>copyRoomBtn.textContent='คัดลอก',1400); }catch(err){}
    ta.remove();
  }
}
copyRoomBtn.addEventListener('click',copyRoomCode);

async function leaveClass(){
  if(!classroomId || !myStudentId) return;
  const ok = confirm('ออกจาก Class นี้หรือไม่?\n\nการออกจากห้องจะลบชื่อ คะแนน และคำตอบของคุณออกจากห้องนี้ทันที และหากเข้าร่วมใหม่จะต้องเริ่มทำใหม่');
  if(!ok) return;

  leaveClassBtn.disabled = true;
  leaveClassBtn.textContent = 'กำลังออก...';
  try{
    if(unsubRoom){ unsubRoom(); unsubRoom=null; }
    // ลบ participant document ทั้งหมด เพื่อให้คะแนน/คำตอบหายจาก Class ทันที
    await deleteDoc(doc(db,'classrooms',classroomId,'students',myStudentId));
    clearParticipantSession();

    // สร้าง Anonymous UID ใหม่เมื่อ Join ครั้งถัดไป เพื่อไม่ให้กลับมาใช้ identity เดิม
    try{ await signOut(auth); }catch(e){}
    uid = null; myStudentId=null; classroomId=null; className=''; myName=''; myDept=''; classroom=null;
    myAnswers={pretestAnswers:{},posttestAnswers:{}};
    preIdx=0; postIdx=0; preSubmitted=false; postSubmitted=false; showingMySummary=false; questionCache={};
    root.innerHTML = `<div class="card"><div class="status-box">กำลังออกจาก Class...</div></div>`;
    await signInAnonymously(auth);
  }catch(e){
    console.error('Could not leave class:',e);
    leaveClassBtn.disabled=false;
    leaveClassBtn.textContent='ออกจาก Class';
    alert('ไม่สามารถออกจาก Class ได้ กรุณาลองอีกครั้ง');
  }
}
leaveClassBtn.addEventListener('click',leaveClass);

async function restoreParticipantSession(){
  try{
    const raw = localStorage.getItem(PARTICIPANT_SESSION_KEY);
    if(!raw) return false;
    const saved = JSON.parse(raw);
    if(saved?.role !== 'participant' || saved?.version !== 2 || !saved.classroomId || !saved.studentId) return false;
    if(saved.authUid && saved.authUid !== uid) return false;

    const roomRef = doc(db, 'classrooms', saved.classroomId);
    const studentRef = doc(db, 'classrooms', saved.classroomId, 'students', saved.studentId);
    const [roomSnap, studentSnap] = await Promise.all([getDoc(roomRef), getDoc(studentRef)]);
    if(!roomSnap.exists() || !studentSnap.exists()){ clearParticipantSession(); return false; }

    const roomData = roomSnap.data();
    const studentData = studentSnap.data();
    classroomId = saved.classroomId;
    myStudentId = saved.studentId;
    className = roomData.name || '';
    myName = studentData.name || saved.name || '';
    myDept = studentData.dept || saved.dept || '';

    myAnswers.pretestAnswers = studentData.pretestAnswers || {};
    myAnswers.posttestAnswers = studentData.posttestAnswers || {};
    preSubmitted = !!studentData.pretestSubmittedAt;
    postSubmitted = !!studentData.posttestSubmittedAt;

    localStorage.setItem(PARTICIPANT_SESSION_KEY, JSON.stringify({
      ...saved, name: myName, dept: studentData.dept || saved.dept || '', savedAt: Date.now()
    }));

    roleBadge.style.display = 'inline-block';
    roleBadge.textContent = myName + ' · ' + className;
    classroom = { id:classroomId, ...roomData };
    updateRoomCodeUI();
    if(unsubRoom) unsubRoom();
    unsubRoom = onSnapshot(roomRef, (snap)=>{
      if(!snap.exists()){ clearParticipantSession(); return; }
      classroom = { id:classroomId, ...snap.data() };
      updateRoomCodeUI();
      renderParticipant();
    });
    return true;
  }catch(e){
    console.warn('Could not restore participant session:', e);
    return false;
  }
}

setPersistence(auth, browserLocalPersistence).then(()=>{
  onAuthStateChanged(auth, async (user)=>{
    if(!user) return;
    uid = user.uid;

    // Firebase anonymous auth ถูก persist อยู่แล้ว แต่ข้อมูลการเข้าห้อง
    // (classroom + participant) ต้อง restore แยกจาก Auth session
    const restored = await restoreParticipantSession();
    if(!restored) renderJoin();
  });

  signInAnonymously(auth).catch(err=>{
    root.innerHTML = `<div class="card"><div class="status-box">เข้าสู่ระบบไม่สำเร็จ: ${err.message}</div></div>`;
  });
}).catch(err=>{
  root.innerHTML = `<div class="card"><div class="status-box">เตรียมระบบไม่สำเร็จ: ${err.message}</div></div>`;
});

async function getQuestion(topicId, qid){
  if(questionCache[qid]) return questionCache[qid];
  try{
    const snap = await getDoc(doc(db,'question_bank',topicId,'questions',qid));
    if(snap.exists()){ questionCache[qid] = { id:qid, ...snap.data() }; return questionCache[qid]; }
  }catch(e){}
  return { case:'(ไม่พบคำถาม)', options: OPTIONS_DEFAULT, correct:0 };
}

// ---------- JOIN ----------
function renderJoin(){
  titleText.textContent = "เข้าร่วมการบรรยาย";
  roomChip.style.display='none';
  leaveClassBtn.style.display='none';
  roleBadge.style.display='none';
  root.innerHTML = `
    <div class="card join-hero">
      <div class="join-kicker">ER TRIAGE · PARTICIPANT</div>
      <div class="join-title">เข้าร่วมกิจกรรม</div>
      <p class="join-subtitle">กรอกรหัสห้องจากหน้าจอผู้บรรยาย แล้วเริ่มทำกิจกรรมได้ทันที</p>
    </div>
    <div class="card join-form-card">
      <div class="room-hint"><span class="room-hint-icon">🔑</span><span>ขอ <strong>รหัสห้อง</strong> จากผู้บรรยายหรือเพื่อนที่อยู่ในห้อง</span></div>
      <div class="field-wrap"><label for="codeInput">รหัส Classroom</label><input type="text" id="codeInput" placeholder="เช่น A7K2P" maxlength="8" autocomplete="off"></div>
      <div class="field-wrap"><label for="nameInput">ชื่อ-นามสกุล</label><input type="text" id="nameInput" placeholder="เช่น สมหญิง ใจดี" autocomplete="name"></div>
      <div class="field-wrap"><label for="deptInput">หน่วยงาน <span style="font-weight:400;color:#87928f;">(ถ้ามี)</span></label><input type="text" id="deptInput" placeholder="เช่น ER" autocomplete="organization"></div>
      <div class="error-text" id="errText" style="display:none;"></div>
      <button class="primary" id="joinBtn">เข้าร่วมกิจกรรม →</button>
    </div>
  `;
  document.getElementById('joinBtn').addEventListener('click', doJoin);
}

async function doJoin(){
  const errText = document.getElementById('errText');
  const btn = document.getElementById('joinBtn');
  const codeVal = document.getElementById('codeInput').value.trim().toUpperCase();
  const name = document.getElementById('nameInput').value.trim();
  const dept = document.getElementById('deptInput').value.trim();
  if(!codeVal || !name){
    errText.textContent = 'กรุณากรอกรหัส Classroom และชื่อให้ครบ';
    errText.style.display = 'block';
    return;
  }
  btn.disabled = true; btn.textContent = 'กำลังเข้าร่วม...';

  const q = query(collection(db,'classrooms'), where('code','==',codeVal));
  const snap = await getDocs(q);
  if(snap.empty){
    errText.textContent = 'ไม่พบ Classroom นี้ กรุณาตรวจสอบรหัสอีกครั้ง';
    errText.style.display = 'block';
    btn.disabled = false; btn.textContent = 'เข้าร่วม';
    return;
  }
  const roomDoc = snap.docs[0];
  classroomId = roomDoc.id;
  className = roomDoc.data().name;
  myName = name;
  myDept = dept;

  // Identity ของ participant ผูกกับ Firebase Anonymous UID ไม่ใช่ชื่อ
  // ชื่อซ้ำกันจึงไม่สามารถทำให้ผู้เข้าร่วมสองคนใช้ record เดียวกันได้
  myStudentId = uid;
  const studentRef = doc(db,'classrooms',classroomId,'students',myStudentId);
  const existingSnap = await getDoc(studentRef);
  const existingData = existingSnap.exists() ? existingSnap.data() : null;

  await setDoc(studentRef, {
    name, dept,
    joinedAt: existingData?.joinedAt || new Date().toISOString(),
    pretestAnswers: existingData?.pretestAnswers || {},
    posttestAnswers: existingData?.posttestAnswers || {},
    ...(existingData?.pretestSubmittedAt ? { pretestSubmittedAt: existingData.pretestSubmittedAt } : {}),
    ...(existingData?.posttestSubmittedAt ? { posttestSubmittedAt: existingData.posttestSubmittedAt } : {})
  });

  // เก็บ session สำหรับ restore หลัง refresh / ปิดแท็บ / เปิดหน้าใหม่
  saveParticipantSession();

  myAnswers.pretestAnswers = existingData?.pretestAnswers || {};
  myAnswers.posttestAnswers = existingData?.posttestAnswers || {};
  preSubmitted = !!existingData?.pretestSubmittedAt;
  postSubmitted = !!existingData?.posttestSubmittedAt;

  roleBadge.style.display = 'inline-block';
  roleBadge.textContent = myName + ' · ' + className;
  updateRoomCodeUI();

  unsubRoom = onSnapshot(doc(db,'classrooms',classroomId), (s)=>{
    if(!s.exists()) return;
    classroom = { id:classroomId, ...s.data() };
    updateRoomCodeUI();
    renderParticipant();
  });
}

// ---------- PARTICIPANT VIEW ----------
function bottomLink(){
  return `<button class="linkbtn" id="mySummaryLink">${showingMySummary ? '← กลับไปหน้าคำถาม' : 'ดูสรุปคะแนนของฉัน (Pre vs Post)'}</button>`;
}
function bindBottomLink(){
  document.getElementById('mySummaryLink').addEventListener('click', ()=>{
    showingMySummary = !showingMySummary;
    renderParticipant();
  });
}

function participantRoomBanner(){
  const code = classroom?.code || '—';
  return `<div class="participant-room-banner">
    <div><div class="participant-room-meta">รหัสห้อง · แชร์ให้เพื่อนเข้าร่วม</div><div class="participant-room-code">${code}</div></div>
    <button type="button" class="participant-room-share" id="shareRoomBtn">คัดลอกรหัส</button>
  </div>`;
}
function bindRoomBanner(){
  const b=document.getElementById('shareRoomBtn');
  if(!b) return;
  b.addEventListener('click',async()=>{
    await copyRoomCode();
    b.textContent='คัดลอกแล้ว';
    setTimeout(()=>{ if(document.getElementById('shareRoomBtn')) document.getElementById('shareRoomBtn').textContent='คัดลอกรหัส'; },1400);
  });
}

async function renderParticipant(){
  titleText.textContent = "ผู้ฟัง";
  const mode = classroom.mode || 'lobby';

  if(mode === 'ended'){
    return renderEndedScreen();
  }

  if(showingMySummary){
    await renderMySummary();
    return;
  }

  if(mode === 'lobby'){
    root.innerHTML = participantRoomBanner() + `<div class="card status-card"><div class="status-box"><div class="status-icon">⏳</div><div class="big">พร้อมแล้ว</div><span class="live-dot"></span>รอผู้บรรยายเริ่มกิจกรรม</div></div>` + bottomLink();
    bindRoomBanner(); bindBottomLink();
    return;
  }
  if(mode === 'lecture'){
    root.innerHTML = participantRoomBanner() + `<div class="card status-card"><div class="status-box"><div class="status-icon">🎓</div><div class="big"><span class="live-dot"></span>กำลังบรรยาย</div>ฟังเนื้อหาต่อได้เลย</div></div>` + bottomLink();
    bindRoomBanner(); bindBottomLink();
    return;
  }
  if(mode === 'pretest'){
    return renderTest('pretest');
  }
  if(mode === 'posttest'){
    return renderTest('posttest');
  }
  root.innerHTML = `<div class="card"><div class="status-box">รอสักครู่...</div></div>`;
}

async function renderTest(phase){
  const ids = phase==='pretest' ? classroom.pretestQuestionIds : classroom.posttestQuestionIds;
  const topicId = phase==='pretest' ? classroom.pretestTopicId : classroom.posttestTopicId;
  const field = phase==='pretest' ? 'pretestAnswers' : 'posttestAnswers';
  const submitted = phase==='pretest' ? preSubmitted : postSubmitted;

  if(submitted){
    root.innerHTML = `<div class="card"><div class="status-box"><div class="big">ส่งคำตอบเรียบร้อยแล้ว</div>รอผลจากผู้บรรยาย</div></div>` + bottomLink();
    bindBottomLink();
    return;
  }

  let idx = phase==='pretest' ? preIdx : postIdx;
  if(idx >= ids.length) idx = ids.length - 1;
  idx = Math.max(0, idx);
  const qid = ids[idx];
  const answeredCount = Object.keys(myAnswers[field]).length;
  const isLast = idx === ids.length - 1;

  root.innerHTML = `<div class="card"><div class="status-box">กำลังโหลดคำถาม...</div></div>`;
  const q = await getQuestion(topicId, qid);
  const opts = q.options || OPTIONS_DEFAULT;
  const currentAnswer = myAnswers[field][qid];

  root.innerHTML = `
    <div class="card">
      <div class="qtag">${phase === 'pretest' ? 'PRETEST' : 'POST-TEST'} · ข้อ ${idx+1}/${ids.length} · ตอบแล้ว ${answeredCount}/${ids.length}</div>
      <div class="quiz-progress" aria-label="ความคืบหน้า"><span style="width:${ids.length ? Math.round((answeredCount/ids.length)*100) : 0}%"></span></div>
      <div class="case-box">${q.case}</div>
      <div id="optWrap"></div>
      <div class="nav-row">
        <button class="ghost" id="prevBtn" style="flex:1;" ${idx===0?'disabled':''}>ย้อนกลับ</button>
        ${isLast
          ? `<button class="primary" id="submitBtn" style="flex:1;" ${answeredCount < ids.length ? 'disabled' : ''}>${answeredCount < ids.length ? `ตอบให้ครบก่อนส่ง (${answeredCount}/${ids.length})` : 'ส่งคำตอบ (Submit)'}</button>`
          : `<button class="primary" id="nextBtn" style="flex:1;">ข้อถัดไป</button>`}
      </div>
      ${isLast && answeredCount < ids.length ? `<div class="small-muted" style="margin-top:10px; text-align:center;">กรุณาตอบให้ครบทุกข้อก่อนจึงจะส่งข้อสอบได้</div>` : ''}
    </div>
  ` + bottomLink();

  const wrap = document.getElementById('optWrap');
  opts.forEach((opt, oIdx)=>{
    const div = document.createElement('div');
    div.className = 'option' + (currentAnswer===oIdx ? ' selected' : '');
    div.innerHTML = `<span class="dot"></span>${swatch(oIdx)}<span>${opt}</span>`;
    div.addEventListener('click', async ()=>{
      myAnswers[field][qid] = oIdx;
      // บันทึกคำตอบทันที เพื่อป้องกันคำตอบหายเมื่อ refresh / network reconnect
      try{
        await updateDoc(doc(db,'classrooms',classroomId,'students',myStudentId), { [field]: myAnswers[field] });
        saveParticipantSession();
      }catch(e){
        console.warn('Could not save answer:', e);
      }
      renderTest(phase);
    });
    wrap.appendChild(div);
  });

  document.getElementById('prevBtn').addEventListener('click', ()=>{
    if(phase==='pretest') preIdx = Math.max(0, idx-1); else postIdx = Math.max(0, idx-1);
    renderTest(phase);
  });
  if(isLast){
    const submitBtn = document.getElementById('submitBtn');
    if(submitBtn) submitBtn.addEventListener('click', ()=>submitTest(phase));
  } else {
    document.getElementById('nextBtn').addEventListener('click', ()=>{
      if(phase==='pretest') preIdx = Math.min(ids.length-1, idx+1); else postIdx = Math.min(ids.length-1, idx+1);
      renderTest(phase);
    });
  }
  bindBottomLink();
}

async function submitTest(phase){
  const field = phase==='pretest' ? 'pretestAnswers' : 'posttestAnswers';
  const stampField = phase==='pretest' ? 'pretestSubmittedAt' : 'posttestSubmittedAt';
  const ids = phase==='pretest' ? (classroom.pretestQuestionIds || []) : (classroom.posttestQuestionIds || []);
  const answered = Object.keys(myAnswers[field] || {}).filter(qid => ids.includes(qid)).length;
  if(answered < ids.length){
    alert(`กรุณาตอบให้ครบทุกข้อก่อนส่ง (${answered}/${ids.length})`);
    return;
  }
  try{
    await updateDoc(doc(db,'classrooms',classroomId,'students',myStudentId), {
      [field]: myAnswers[field],
      [stampField]: new Date().toISOString()
    });
  }catch(e){}
  if(phase==='pretest') preSubmitted = true; else postSubmitted = true;
  saveParticipantSession();
  renderTest(phase);
}

async function renderEndedScreen(){
  titleText.textContent = "จบการบรรยาย";
  root.innerHTML = `<div class="card"><div class="status-box">กำลังสรุปคะแนนของคุณ...</div></div>`;

  const preIds = classroom.pretestQuestionIds, postIds = classroom.posttestQuestionIds;
  await Promise.all(preIds.map(qid=>getQuestion(classroom.pretestTopicId, qid)));
  await Promise.all(postIds.map(qid=>getQuestion(classroom.posttestTopicId, qid)));

  function breakdown(ans, ids){
    let correct=0, under=0, over=0, answered=0;
    ids.forEach(qid=>{
      const q = questionCache[qid];
      if(!q || ans?.[qid]===undefined) return;
      answered++;
      const d = ans[qid] - q.correct;
      if(d===0) correct++; else if(d>0) under++; else over++;
    });
    return { correct, under, over, answered };
  }
  const preB = breakdown(myAnswers.pretestAnswers, preIds);
  const postB = breakdown(myAnswers.posttestAnswers, postIds);
  const delta = postB.correct - preB.correct;
  const deltaClass = delta > 0 ? 'delta-up' : (delta < 0 ? 'delta-down' : 'delta-flat');
  const deltaLabel = delta > 0 ? `+${delta}` : `${delta}`;
  const triageMode = classroom.triageMode !== false;

  root.innerHTML = `
    <div class="card" style="text-align:center;">
      <div class="celebrate">🎉</div>
      <div class="status-box" style="padding:0;">
        <div class="big" style="font-size:20px;">ขอบคุณที่เข้าร่วม!</div>
        <div>${myName}${className ? ' · '+className : ''}</div>
      </div>
    </div>
    <div class="card">
      <div class="lead">คะแนนของคุณ</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="num">${preB.correct}/${preIds.length}</div><div class="lab">Pretest</div></div>
        <div class="stat-box"><div class="num">${postB.correct}/${postIds.length}</div><div class="lab">Post-test</div></div>
      </div>
      <div class="status-box" style="padding-top:6px;">
        <span class="${deltaClass}" style="font-size:22px; font-weight:700;">${deltaLabel} คะแนน</span><br>
        <span style="font-size:13px;">พัฒนาการก่อน-หลังการบรรยาย</span>
      </div>
    </div>
    ${triageMode ? `
    <div class="card">
      <div class="lead" style="margin-bottom:12px;">การประเมิน Triage ของคุณ</div>
      <div class="stat-grid">
        <div class="stat-box"><div class="num" style="color:var(--l1);">${preB.under} → ${postB.under}</div><div class="lab">Undertriage (ข้อ)</div></div>
        <div class="stat-box"><div class="num" style="color:var(--l5);">${preB.over} → ${postB.over}</div><div class="lab">Overtriage (ข้อ)</div></div>
      </div>
      <div class="small-muted" style="text-align:left;">
        Undertriage = ประเมินผู้ป่วยหย่อนกว่าความรุนแรงจริง (เสี่ยงอันตรายที่สุด ควรระวังเป็นพิเศษ)<br>
        Overtriage = ประเมินเข้มกว่าความจำเป็นจริง (ปลอดภัยกว่าแต่ใช้ทรัพยากรเกิน)
      </div>
    </div>` : ''}
  `;
}

      </div>
    </div>

      <div class="stat-grid">
        <div class="stat-box"><div class="num" style="color:var(--l1);">${preB.under} → ${postB.under}</div><div class="lab">Undertriage (ข้อ)</div></div>
        <div class="stat-box"><div class="num" style="color:var(--l5);">${preB.over} → ${postB.over}</div><div class="lab">Overtriage (ข้อ)</div></div>
      </div>
      <div class="small-muted" style="text-align:left;">
        Undertriage = ประเมินผู้ป่วยหย่อนกว่าความรุนแรงจริง (เสี่ยงอันตรายที่สุด ควรระวังเป็นพิเศษ)<br>
        Overtriage = ประเมินเข้มกว่าความจำเป็นจริง (ปลอดภัยกว่าแต่ใช้ทรัพยากรเกิน)
      </div>
    </div>` : ''}
  ` + bottomLink();
  bindBottomLink();
}
</script>
