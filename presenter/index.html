<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B3A40">
<title>Triage Session · Presenter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#1B2A2E; --paper:#F5F4F0; --paper-raised:#FFFFFF; --line:#E3E6E2;
    --teal:#12525A; --teal-deep:#0A2E33; --teal-soft:#EAF3F2;
    --l1:#D6453D; --l2:#E8873A; --l3:#DDAE1F; --l4:#3F9163; --l5:#3E7FA6;
    --shadow-sm:0 1px 2px rgba(11,46,51,.05), 0 1px 3px rgba(11,46,51,.06);
    --shadow-md:0 4px 14px rgba(11,46,51,.08), 0 2px 4px rgba(11,46,51,.04);
    --radius-lg:18px; --radius-md:12px; --radius-sm:9px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{margin:0; font-family:'IBM Plex Sans Thai','IBM Plex Sans',-apple-system,"Segoe UI",sans-serif;
    background:var(--paper); color:var(--ink); line-height:1.6; -webkit-font-smoothing:antialiased;}
  .app{max-width:720px; margin:0 auto; padding:16px 16px calc(env(safe-area-inset-bottom,0px) + 48px);}
  @keyframes fadeInUp{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .card{ animation:fadeInUp .28s ease both; }

  .topbar{position:sticky; top:0; z-index:20; display:flex; align-items:center; justify-content:space-between;
    padding:calc(env(safe-area-inset-top,0px) + 14px) 0 14px; margin:0 -16px 16px; padding-left:16px; padding-right:16px;
    background:var(--paper); border-bottom:1px solid var(--line);}
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .dot-logo{width:32px; height:32px; border-radius:10px; background:linear-gradient(145deg,var(--teal),var(--teal-deep));
    flex-shrink:0; box-shadow:var(--shadow-sm);}
  .brand .mark{font-size:11px; color:var(--teal); font-weight:700; letter-spacing:.04em;}
  .brand h1{font-size:17px; margin:1px 0 0; font-weight:700; color:var(--teal-deep); line-height:1.2;}
  .badge{font-size:11.5px; padding:5px 11px; border-radius:20px; background:var(--teal); color:#fff; font-weight:600; white-space:nowrap;}

  .navrow{display:flex; gap:6px; margin-bottom:16px; background:var(--paper); padding:4px; border-radius:var(--radius-md); border:1px solid var(--line);}
  .navrow button{flex:1; border:none; background:transparent; color:var(--ink); min-height:42px;
    font-size:13.5px; padding:8px 6px; border-radius:8px; cursor:pointer; font-weight:600; transition:background .15s, color .15s;}
  .navrow button.active{background:var(--teal); color:#fff; box-shadow:var(--shadow-sm);}

  .classbar{display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(135deg,var(--teal),var(--teal-deep)); color:#fff; border-radius:var(--radius-lg);
    padding:16px 18px; margin-bottom:16px; font-size:13px; box-shadow:var(--shadow-md);}
  .classbar .code{font-size:24px; font-weight:700; letter-spacing:.08em; font-family:'IBM Plex Sans',monospace;}
  .classbar .roomname{opacity:.85; font-size:12px;}
  .classbar .btnrow{display:flex; gap:8px;}
  .classbar button{background:rgba(255,255,255,.16); color:#fff; border:1px solid rgba(255,255,255,.3);
    border-radius:20px; padding:8px 14px; font-size:12.5px; cursor:pointer; font-weight:600; min-height:36px;
    transition:background .15s;}
  .classbar button:active{background:rgba(255,255,255,.3);}

  .card{background:var(--paper-raised); border:1px solid var(--line); border-radius:var(--radius-lg);
    padding:20px; margin-bottom:14px; box-shadow:var(--shadow-sm);}
  .lead{font-size:14.5px; color:#4A5754; margin:0 0 16px; line-height:1.65;}
  label{display:block; font-size:13px; font-weight:600; color:var(--teal-deep); margin-bottom:7px;}
  input[type=text],input[type=number],input[type=password],textarea{width:100%; padding:13px 14px; border:1.5px solid var(--line);
    border-radius:var(--radius-sm); font-size:16px; margin-bottom:14px; background:var(--paper); color:var(--ink);
    font-family:inherit; transition:border-color .15s;}
  input:focus,textarea:focus{outline:none; border-color:var(--teal);}
  textarea{resize:vertical; min-height:76px;}

  button{-webkit-tap-highlight-color:transparent;}
  button.primary{background:var(--teal); color:#fff; border:none; border-radius:var(--radius-sm); padding:14px 18px;
    font-size:15.5px; font-weight:600; cursor:pointer; width:100%; min-height:50px; box-shadow:var(--shadow-sm);
    transition:transform .08s, background .15s;}
  @media (hover:hover){ button.primary:hover{background:var(--teal-deep);} }
  button.primary:active{transform:scale(.98);}
  button.primary:disabled{opacity:.4; cursor:not-allowed; transform:none;}
  button.ghost{background:var(--paper-raised); color:var(--teal); border:1.5px solid var(--teal); border-radius:var(--radius-sm);
    padding:12px 16px; font-size:14px; cursor:pointer; min-height:46px; font-weight:600; transition:transform .08s, background .15s;}
  button.ghost:active{transform:scale(.98); background:var(--teal-soft);}
  button.small{padding:7px 12px; font-size:12.5px; border-radius:20px; min-height:auto;}
  button.danger{background:var(--l1); color:#fff; border:none; border-radius:var(--radius-sm); padding:12px 16px;
    font-size:14px; cursor:pointer; min-height:46px; font-weight:600; transition:transform .08s, background .15s;}
  button.danger:active{transform:scale(.98);}
  @media (hover:hover){ button.danger:hover{background:#B93A33;} }

  .case-box{background:var(--teal-soft); border-left:4px solid var(--teal); border-radius:var(--radius-sm); padding:16px 17px;
    margin-bottom:16px; font-size:15.5px; line-height:1.65;}
  .swatch{width:11px; height:11px; border-radius:50%; display:inline-block; margin-right:5px; flex-shrink:0;}
  .status-box{text-align:center; padding:34px 14px; color:#6B7674; font-size:15px;}
  .status-box .big{font-size:18px; color:var(--teal-deep); font-weight:700; margin-bottom:8px;}
  .qtag{font-size:12px; font-weight:700; color:var(--teal); margin-bottom:6px; letter-spacing:.02em;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:8px;}
  .stat-box{background:var(--paper); border-radius:var(--radius-md); padding:16px 12px; text-align:center;}
  .stat-box .num{font-size:25px; font-weight:700; color:var(--teal-deep); line-height:1.2;}
  .stat-box .lab{font-size:11.5px; color:#6B7674; margin-top:3px; font-weight:500;}
  table{width:100%; border-collapse:collapse; font-size:13px;}
  th,td{padding:10px 6px; text-align:left; border-bottom:1px solid var(--line); vertical-align:top;}
  th{color:var(--teal-deep); font-size:11px; text-transform:uppercase; letter-spacing:.03em;}
  .delta-up{color:var(--l4); font-weight:700;} .delta-down{color:var(--l1); font-weight:700;} .delta-flat{color:#8A9391; font-weight:700;}
  .nav-row{display:flex; gap:10px; margin-top:14px;} .nav-row > *{flex:1;}
  .small-muted{font-size:12px; color:#8A9391; margin-top:12px; text-align:center; line-height:1.5;}
  .roomrow{display:flex; justify-content:space-between; align-items:center; padding:13px 4px; border-bottom:1px solid var(--line);}
  .roomrow:last-child{border-bottom:none;}
  .roomrow .rname{font-weight:600; font-size:14.5px;}
  .roomrow .rmeta{font-size:12px; color:#6B7674; margin-top:2px;}
  .topicpill{display:inline-block; padding:8px 14px; border:1.5px solid var(--line); border-radius:20px;
    font-size:13px; cursor:pointer; margin:0 6px 6px 0; font-weight:500; transition:background .15s, border-color .15s;}
  .topicpill.active{background:var(--teal); color:#fff; border-color:var(--teal); font-weight:600;}
  .qcheckrow{display:flex; align-items:flex-start; gap:10px; padding:13px; border:1.5px solid var(--line);
    border-radius:var(--radius-sm); margin-bottom:8px; cursor:pointer; font-size:13.5px; transition:border-color .15s, background .15s;}
  .qcheckrow.checked{border-color:var(--teal); background:var(--teal-soft);}
  .qcheckrow input{margin-top:3px; width:18px; height:18px; flex-shrink:0;}
  .opt5{display:grid; grid-template-columns:1fr; gap:10px; margin-bottom:10px;}
  .opt5 .orow{display:flex; gap:8px; align-items:center;}
  .opt5 .oswatch{width:11px; height:11px; border-radius:50%; flex-shrink:0;}
  .opt5 input[type=text]{margin-bottom:0;}
  .opt5 input[type=radio]{flex-shrink:0; width:18px; height:18px;}
  .filerow{border:1.5px dashed var(--line); border-radius:var(--radius-md); padding:20px; text-align:center; margin-bottom:14px;}
  .errtag{color:var(--l1); font-size:11.5px; font-weight:700;}
  .oktag{color:var(--l4); font-size:11.5px; font-weight:700;}
</style>
</head>
<body>
<div class="app">
  <div class="topbar">
    <div class="brand">
      <div class="dot-logo"></div>
      <div>
        <span class="mark">ER TRIAGE · PRESENTER</span>
        <h1 id="titleText">แผงควบคุมผู้บรรยาย</h1>
      </div>
    </div>
    <span class="badge" id="statusBadge">กำลังเชื่อมต่อ...</span>
  </div>
  <div id="root"><div class="card"><div class="status-box">กำลังเข้าสู่ระบบ...</div></div></div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.0/firebase-app.js";
import {
  getAuth, signInAnonymously, onAuthStateChanged, setPersistence, inMemoryPersistence
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-auth.js";
import {
  getFirestore, doc, getDoc, setDoc, addDoc, updateDoc, deleteDoc,
  collection, query, where, getDocs, onSnapshot, writeBatch, serverTimestamp, orderBy
} from "https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDNO-XsILUd4_Wm6WPiJUCd4t032GYAzx4",
  authDomain: "lecturebymyself-44dd8.firebaseapp.com",
  projectId: "lecturebymyself-44dd8",
  storageBucket: "lecturebymyself-44dd8.firebasestorage.app",
  messagingSenderId: "633622263197",
  appId: "1:633622263197:web:58dd3900599a34e2b12b74",
  measurementId: "G-BEW4ZE5WSR"
};

const fbApp = initializeApp(firebaseConfig);
const auth = getAuth(fbApp);
const db = getFirestore(fbApp);

const OPTIONS_DEFAULT = ["Level 1 (แดง)","Level 2 (ส้ม)","Level 3 (เหลือง)","Level 4 (เขียว)","Level 5 (ขาว)"];
const LEVEL_COLORS = ["var(--l1)","var(--l2)","var(--l3)","var(--l4)","var(--l5)"];

const root = document.getElementById('root');
const titleText = document.getElementById('titleText');
const statusBadge = document.getElementById('statusBadge');

let uid = null;
let view = 'classrooms'; // classrooms | bank | classroom-new | classroom-control
let unsubRoom = null, unsubStudents = null;
let currentClassroom = null;
let currentStudents = [];
let questionCache = {};
let bankTopics = [];
let selectedTopicId = null;
let csvPreview = null;
let resultsTab = 'pretest'; // 'pretest' | 'posttest' | 'compare'

let presenterAuthed = false;
const PRESENTER_PASSCODE = "triage2026"; // TODO: เปลี่ยนรหัสผ่านตรงนี้เป็นของคุณเอง

function swatch(i){ return `<span class="swatch" style="background:${LEVEL_COLORS[i]}"></span>`; }
function genCode(){
  const chars = "ABCDEFGHJKMNPQRSTUVWXYZ23456789";
  let s=''; for(let i=0;i<5;i++) s+=chars[Math.floor(Math.random()*chars.length)];
  return s;
}
function csvEscape(v){ const s=(v===null||v===undefined)?'':String(v); return '"'+s.replace(/"/g,'""')+'"'; }
function shuffle(arr){ const a=[...arr]; for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

// ---------- AUTH ----------
setPersistence(auth, inMemoryPersistence).then(()=>{
  onAuthStateChanged(auth, (user)=>{
    if(user){ uid = user.uid; statusBadge.textContent = presenterAuthed ? 'PRESENTER' : 'ล็อกอยู่'; render(); }
  });
  signInAnonymously(auth).catch(err=>{
    statusBadge.textContent = 'เชื่อมต่อไม่สำเร็จ';
    root.innerHTML = `<div class="card"><div class="status-box">เข้าสู่ระบบไม่สำเร็จ: ${err.message}</div></div>`;
  });
});

// ---------- PRESENTER GATE ----------
function renderGate(){
  titleText.textContent = "เข้าสู่ระบบผู้บรรยาย";
  statusBadge.textContent = 'ล็อกอยู่';
  root.innerHTML = `
    <div class="card">
      <p class="lead">กรุณาใส่รหัสผ่านผู้บรรยายเพื่อเข้าใช้งานแผงควบคุม</p>
      <input type="password" id="passInput" placeholder="รหัสผ่าน" autofocus>
      <div class="errtag" id="passErr" style="display:none; margin:-8px 0 12px;">รหัสผ่านไม่ถูกต้อง</div>
      <button class="primary" id="passBtn">เข้าสู่ระบบ</button>
    </div>
  `;
  const passInput = document.getElementById('passInput');
  const tryLogin = ()=>{
    if(passInput.value === PRESENTER_PASSCODE){
      presenterAuthed = true; statusBadge.textContent = 'PRESENTER'; view='classrooms'; render();
    } else { document.getElementById('passErr').style.display = 'block'; }
  };
  document.getElementById('passBtn').addEventListener('click', tryLogin);
  passInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') tryLogin(); });
}

// ---------- NAV ----------
function navBar(){
  return `
    <div class="navrow">
      <button id="navClassrooms" class="${(view==='classrooms'||view==='classroom-new')?'active':''}">Classroom</button>
      <button id="navBank" class="${view==='bank'?'active':''}">คลังข้อสอบ</button>
    </div>
  `;
}
function bindNav(){
  document.getElementById('navClassrooms').addEventListener('click', ()=>{ leaveRoom(); view='classrooms'; render(); });
  document.getElementById('navBank').addEventListener('click', ()=>{ leaveRoom(); view='bank'; render(); });
}
function leaveRoom(){
  if(unsubRoom) unsubRoom(); if(unsubStudents) unsubStudents();
  unsubRoom=null; unsubStudents=null; currentClassroom=null; currentStudents=[];
}

async function getQuestion(topicId, qid){
  if(questionCache[qid]) return questionCache[qid];
  try{
    const snap = await getDoc(doc(db,'question_bank',topicId,'questions',qid));
    if(snap.exists()){ questionCache[qid] = { id:qid, topicId, ...snap.data() }; return questionCache[qid]; }
  }catch(e){}
  return { case:'(ไม่พบคำถาม)', options: OPTIONS_DEFAULT, correct:0 };
}
async function ensureQuestionsCached(ids, topicId){
  for(const qid of ids){ if(!questionCache[qid]) await getQuestion(topicId, qid); }
}

// ============ CLASSROOMS LIST ============
async function renderClassroomsList(){
  root.innerHTML = navBar() + `<div class="card"><div class="status-box">กำลังโหลด...</div></div>`;
  bindNav();
  let rooms = [];
  try{
    const q = query(collection(db,'classrooms'), where('presenterUid','==',uid));
    const snap = await getDocs(q);
    snap.forEach(d=> rooms.push({id:d.id, ...d.data()}));
    rooms.sort((a,b)=> (b.createdAt?.seconds||0) - (a.createdAt?.seconds||0));
  }catch(e){}

  let roomsHtml = rooms.length ? rooms.map(r=>`
    <div class="roomrow">
      <div><div class="rname">${r.name}</div><div class="rmeta">รหัส ${r.code}</div></div>
      <button class="ghost small" data-id="${r.id}">เข้าควบคุม</button>
    </div>
  `).join('') : `<div class="small-muted">ยังไม่เคยสร้าง Classroom</div>`;

  root.innerHTML = navBar() + `
    <div class="card">
      <p class="lead">สร้าง Classroom ใหม่สำหรับรอบการอบรมนี้ ต้องมีคำถามในคลังข้อสอบอย่างน้อย 1 หัวข้อก่อน</p>
      <button class="primary" id="newRoomBtn">+ สร้าง Classroom ใหม่</button>
    </div>
    <div class="card">
      <label style="margin-bottom:8px;">Classroom ที่เคยสร้าง</label>
      ${roomsHtml}
    </div>
  `;
  bindNav();
  document.getElementById('newRoomBtn').addEventListener('click', ()=>{ view='classroom-new'; render(); });
  root.querySelectorAll('[data-id]').forEach(btn=>{
    btn.addEventListener('click', ()=> enterRoom(btn.dataset.id));
  });
}

// ============ CLASSROOM CREATE ============
let newRoomState = { name:'', pretestTopicId:null, pretestSelected:[], posttestTopicId:null, posttestCount:10, triageMode:true };

async function renderClassroomNew(){
  newRoomState = { name:'', pretestTopicId:null, pretestSelected:[], posttestTopicId:null, posttestCount:10, triageMode:true };
  root.innerHTML = navBar() + `<div class="card"><div class="status-box">กำลังโหลดคลังข้อสอบ...</div></div>`;
  bindNav();
  const topics = await fetchTopics();

  if(topics.length === 0){
    root.innerHTML = navBar() + `<div class="card"><div class="status-box">ยังไม่มีหัวข้อในคลังข้อสอบ กรุณาไปสร้างคำถามที่แท็บ "คลังข้อสอบ" ก่อน</div></div>`;
    bindNav();
    return;
  }

  root.innerHTML = navBar() + `
    <div class="card">
      <label for="roomName">ชื่อรอบ / กลุ่ม</label>
      <input type="text" id="roomName" placeholder="เช่น Batch 12 - เช้า">
    </div>
    <div class="card">
      <label>1. เลือกหัวข้อสำหรับ Pretest (เลือกข้อเอง)</label>
      <div id="preTopicPills">${topics.map(t=>`<span class="topicpill" data-id="${t.id}">${t.name}</span>`).join('')}</div>
      <div id="preQuestionList" style="margin-top:10px;"></div>
    </div>
    <div class="card">
      <label>2. เลือกหัวข้อสำหรับ Post-test (สุ่มอัตโนมัติ)</label>
      <div id="postTopicPills">${topics.map(t=>`<span class="topicpill" data-id="${t.id}">${t.name}</span>`).join('')}</div>
      <label for="postCount" style="margin-top:10px;">จำนวนข้อที่จะสุ่ม</label>
      <input type="number" id="postCount" value="10" min="1">
      <div class="small-muted" id="postAvailHint" style="text-align:left; margin-top:-8px;"></div>
    </div>
    <div class="card">
      <label style="margin-bottom:10px;">3. รูปแบบการให้คะแนน</label>
      <div class="qcheckrow checked" id="triageModeRow">
        <input type="checkbox" id="triageModeCheck" checked>
        <div>
          <strong style="font-size:13.5px;">เปิดการวิเคราะห์ Undertriage / Overtriage</strong>
          <div style="font-size:12.5px; color:#6B7674; margin-top:2px;">เหมาะกับคำถามที่เป็นการจัดระดับความรุนแรงแบบเรียงลำดับ (เช่น ESI/MOPH Triage หรือ START/SALT ใน MCI) ถ้าปิดไว้ ระบบจะคิดคะแนนแบบถูก/ผิดปกติเท่านั้น</div>
        </div>
      </div>
    </div>
    <div class="card">
      <button class="primary" id="createRoomBtn" disabled>สร้าง Classroom</button>
    </div>
  `;
  bindNav();

  document.getElementById('triageModeRow').addEventListener('click', ()=>{
    newRoomState.triageMode = !newRoomState.triageMode;
    const row = document.getElementById('triageModeRow');
    row.classList.toggle('checked', newRoomState.triageMode);
    document.getElementById('triageModeCheck').checked = newRoomState.triageMode;
  });

  root.querySelectorAll('#preTopicPills .topicpill').forEach(p=>{
    p.addEventListener('click', async ()=>{
      root.querySelectorAll('#preTopicPills .topicpill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      newRoomState.pretestTopicId = p.dataset.id;
      newRoomState.pretestSelected = [];
      const qs = await fetchQuestions(p.dataset.id);
      const wrap = document.getElementById('preQuestionList');
      wrap.innerHTML = qs.map(q=>`
        <div class="qcheckrow" data-qid="${q.id}">
          <input type="checkbox">
          <div>${q.case}<br><span style="color:#6B7674; font-size:12px;">เฉลย: ${(q.options||OPTIONS_DEFAULT)[q.correct]}</span></div>
        </div>
      `).join('') || '<div class="small-muted">หัวข้อนี้ยังไม่มีคำถาม</div>';
      wrap.querySelectorAll('.qcheckrow').forEach(row=>{
        row.addEventListener('click', ()=>{
          const cb = row.querySelector('input'); cb.checked = !cb.checked;
          row.classList.toggle('checked', cb.checked);
          const qid = row.dataset.qid;
          if(cb.checked) newRoomState.pretestSelected.push(qid);
          else newRoomState.pretestSelected = newRoomState.pretestSelected.filter(x=>x!==qid);
          validateCreate();
        });
      });
      validateCreate();
    });
  });

  root.querySelectorAll('#postTopicPills .topicpill').forEach(p=>{
    p.addEventListener('click', async ()=>{
      root.querySelectorAll('#postTopicPills .topicpill').forEach(x=>x.classList.remove('active'));
      p.classList.add('active');
      newRoomState.posttestTopicId = p.dataset.id;
      const qs = await fetchQuestions(p.dataset.id);

async function createClassroom(){

// index 0 = Level1 (most urgent) ... index 4 = Level5 (least urgent)
// chosen > correct  => picked a LESS urgent level than needed => UNDER-triage (dangerous)
// chosen < correct  => picked a MORE urgent level than needed => OVER-triage (wastes resources)
function triageBreakdown(s, phase, ids){
  const field = phase==='pretest' ? 'pretestAnswers' : 'posttestAnswers';
  const ans = s[field] || {};
  let correct=0, answered=0, under=0, over=0, underMag=0, overMag=0;
  ids.forEach(qid=>{
    const q = questionCache[qid];
    if(!q || ans[qid]===undefined) return;
    answered++;
    const d = ans[qid] - q.correct;
    if(d===0) correct++;
    else if(d>0){ under++; underMag+=d; }
    else { over++; overMag+=Math.abs(d); }
  });
  return { correct, under, over, underMag, overMag, answered };
}
function aggregateTriage(students, phase, ids){
  let under=0, over=0, answered=0;
  students.forEach(s=>{ const b = triageBreakdown(s, phase, ids); under+=b.under; over+=b.over; answered+=b.answered; });
  return { under, over, answered };
}

async function renderLiveLeaderboard(phase){
  const wrap = document.getElementById('resultsContent');
  const ids = phase==='pretest' ? currentClassroom.pretestQuestionIds : currentClassroom.posttestQuestionIds;
  const topicId = phase==='pretest' ? currentClassroom.pretestTopicId : currentClassroom.posttestTopicId;
  const triageMode = currentClassroom.triageMode !== false;
  await ensureQuestionsCached(ids, topicId);

  const results = currentStudents.map(s=>{
    const b = triageBreakdown(s, phase, ids);
    return { name:s.name, dept:s.dept, ...b };
  }).sort((a,b)=> b.correct-a.correct || b.answered-a.answered);

  const n = results.length;
  const started = results.filter(r=>r.answered>0).length;
  const avgAmongStarted = started ? results.filter(r=>r.answered>0).reduce((s,r)=>s+r.correct,0)/started : 0;

  let triageStatsHtml = '', underOverHeader = '';
  if(triageMode){
    const agg = aggregateTriage(currentStudents, phase, ids);
    const underPct = agg.answered ? Math.round((agg.under/agg.answered)*100) : 0;
    const overPct = agg.answered ? Math.round((agg.over/agg.answered)*100) : 0;
    triageStatsHtml = `
      <div class="stat-grid">
        <div class="stat-box"><div class="num" style="color:var(--l1);">${underPct}%</div><div class="lab">Undertriage</div></div>
        <div class="stat-box"><div class="num" style="color:var(--l5);">${overPct}%</div><div class="lab">Overtriage</div></div>
      </div>
    `;
    underOverHeader = `<th>Under</th><th>Over</th>`;
  }

  const rows = results.map((r,i)=>{
    const underOverCols = triageMode
      ? `<td style="color:var(--l1); font-weight:600;">${r.under}</td><td style="color:var(--l5); font-weight:600;">${r.over}</td>`
      : '';
    return `<tr>
      <td>${i===0 && r.answered>0 ? '🥇 ' : ''}${r.name}${r.dept?' · '+r.dept:''}</td>
      <td>${r.correct}/${ids.length}</td>
      <td style="color:#6B7674;">${r.answered}/${ids.length}</td>
      ${underOverCols}
    </tr>`;
  }).join('');

  wrap.innerHTML = `
    <div class="stat-grid" style="margin-top:12px;">
      <div class="stat-box"><div class="num">${started}/${n}</div><div class="lab">เริ่มทำแล้ว</div></div>
      <div class="stat-box"><div class="num">${avgAmongStarted.toFixed(1)}/${ids.length}</div><div class="lab">คะแนนเฉลี่ย (เท่าที่ตอบ)</div></div>
    </div>
    ${triageStatsHtml}
    <div style="max-height:320px; overflow-y:auto; margin-top:10px;">
      <table><thead><tr><th>ชื่อ</th><th>คะแนน</th><th>ตอบแล้ว</th>${underOverHeader}</tr></thead>
      <tbody>${rows || `<tr><td colspan=${triageMode?5:3}>ยังไม่มีผู้เริ่มทำ</td></tr>`}</tbody></table>
    </div>
    <div class="small-muted" style="text-align:left;">อัปเดตสดแบบเรียลไทม์ ไม่ต้องรอให้ทุกคนทำครบ</div>
  `;
}

async function renderCompare(){
  const wrap = document.getElementById('resultsContent');
  const preIds = currentClassroom.pretestQuestionIds, postIds = currentClassroom.posttestQuestionIds;
  const triageMode = currentClassroom.triageMode !== false;
  await ensureQuestionsCached(preIds, currentClassroom.pretestTopicId);
  await ensureQuestionsCached(postIds, currentClassroom.posttestTopicId);

  const combined = currentStudents.map(s=>{
    const preB = triageBreakdown(s,'pretest',preIds);
    const postB = triageBreakdown(s,'posttest',postIds);
    return { name:s.name, dept:s.dept, pre:preB.correct, post:postB.correct,
      preAns:preB.answered, postAns:postB.answered,
      preUnder:preB.under, postUnder:postB.under, preOver:preB.over, postOver:postB.over };
  });
  const n = combined.length;
  const avgPre = n ? combined.reduce((s,r)=>s+r.pre,0)/n : 0;
  const avgPost = n ? combined.reduce((s,r)=>s+r.post,0)/n : 0;
  const avgDelta = n ? combined.reduce((s,r)=>s+(r.post-r.pre),0)/n : 0;

  let triageStatsHtml = '', triageNoteHtml = '', underOverHeader = '';
  if(triageMode){
    const preAgg = aggregateTriage(currentStudents,'pretest',preIds);
    const postAgg = aggregateTriage(currentStudents,'posttest',postIds);
    const preUnderPct = preAgg.answered ? Math.round((preAgg.under/preAgg.answered)*100) : 0;
    const postUnderPct = postAgg.answered ? Math.round((postAgg.under/postAgg.answered)*100) : 0;
    const preOverPct = preAgg.answered ? Math.round((preAgg.over/preAgg.answered)*100) : 0;
    const postOverPct = postAgg.answered ? Math.round((postAgg.over/postAgg.answered)*100) : 0;
    const underChange = postUnderPct - preUnderPct;
    triageStatsHtml = `
      <div class="stat-grid">
        <div class="stat-box"><div class="num" style="color:var(--l1);">${preUnderPct}% → ${postUnderPct}%</div><div class="lab">Undertriage</div></div>
        <div class="stat-box"><div class="num" style="color:var(--l5);">${preOverPct}% → ${postOverPct}%</div><div class="lab">Overtriage</div></div>
      </div>
    `;
    triageNoteHtml = `<div class="small-muted">${underChange<0 ? `Undertriage ลดลง ${Math.abs(underChange)} จุด — สัญญาณที่ดี` : (underChange>0 ? `Undertriage เพิ่มขึ้น ${underChange} จุด` : 'Undertriage ไม่เปลี่ยนแปลง')}</div>`;
    underOverHeader = `<th>Under</th><th>Over</th>`;
  }

  const rows = combined.map(c=>{
    const d = c.post-c.pre; const cls = d>0?'delta-up':(d<0?'delta-down':'delta-flat'); const lbl = d>0?`+${d}`:`${d}`;
    const underOverCols = triageMode ? `<td>${c.preUnder}→${c.postUnder}</td><td>${c.preOver}→${c.postOver}</td>` : '';
    return `<tr><td>${c.name}</td><td>${c.pre}/${preIds.length} (${c.preAns} ตอบ)</td><td>${c.post}/${postIds.length} (${c.postAns} ตอบ)</td><td class="${cls}">${lbl}</td>
      ${underOverCols}</tr>`;
  }).join('');

  wrap.innerHTML = `
    <div class="stat-grid" style="margin-top:12px;">
      <div class="stat-box"><div class="num">${avgPre.toFixed(1)}</div><div class="lab">เฉลี่ย Pretest</div></div>
      <div class="stat-box"><div class="num">${avgPost.toFixed(1)}</div><div class="lab">เฉลี่ย Post-test</div></div>
    </div>
    <div class="status-box" style="padding-top:4px;">
      <span style="font-size:20px; font-weight:700; color:var(--teal-deep);">${avgDelta>=0?'+':''}${avgDelta.toFixed(1)}</span><br>
      <span style="font-size:13px;">คะแนนเฉลี่ยที่เปลี่ยนไปต่อคน</span>
    </div>
    ${triageStatsHtml}
    ${triageNoteHtml}
    <div style="max-height:320px; overflow-y:auto; margin-top:12px;">
      <table><thead><tr><th>ชื่อ</th><th>Pre</th><th>Post</th><th>Δ</th>${underOverHeader}</tr></thead>
      <tbody>${rows || `<tr><td colspan=${triageMode?6:4}>ยังไม่มีข้อมูล</td></tr>`}</tbody></table>
    </div>
  `;
}

async function exportCsv(){
  const preIds = currentClassroom.pretestQuestionIds, postIds = currentClassroom.posttestQuestionIds;
  const triageMode = currentClassroom.triageMode !== false;
  await ensureQuestionsCached(preIds, currentClassroom.pretestTopicId);
  await ensureQuestionsCached(postIds, currentClassroom.posttestTopicId);

  const header = ['Name','Department',
    'Pretest_Score','Pretest_Total', ...(triageMode ? ['Pretest_Under','Pretest_UnderMagnitude','Pretest_Over','Pretest_OverMagnitude'] : []),
    'Posttest_Score','Posttest_Total', ...(triageMode ? ['Posttest_Under','Posttest_UnderMagnitude','Posttest_Over','Posttest_OverMagnitude'] : []),
    'Delta']
    .concat(preIds.map((_,i)=>'Pretest_Q'+(i+1)))
    .concat(postIds.map((_,i)=>'Posttest_Q'+(i+1)));

  const rows = [header];
  currentStudents.forEach(s=>{
    const preB = triageBreakdown(s,'pretest',preIds), postB = triageBreakdown(s,'posttest',postIds);
    const preAns = preIds.map(qid=>{
      const c = (s.pretestAnswers||{})[qid]; const q = questionCache[qid];
      return c!==undefined && q ? (q.options||OPTIONS_DEFAULT)[c] : '';
    });
    const postAns = postIds.map(qid=>{
      const c = (s.posttestAnswers||{})[qid]; const q = questionCache[qid];
      return c!==undefined && q ? (q.options||OPTIONS_DEFAULT)[c] : '';
    });
    rows.push([
      s.name, s.dept||'',
      preB.correct, preIds.length, ...(triageMode ? [preB.under, preB.underMag, preB.over, preB.overMag] : []),
      postB.correct, postIds.length, ...(triageMode ? [postB.under, postB.underMag, postB.over, postB.overMag] : []),
      postB.correct-preB.correct,
      ...preAns, ...postAns
    ]);
  });

  const csvContent = '\uFEFF' + rows.map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csvContent], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url; a.download = `triage_${currentClassroom.code}.csv`;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

      <div style="max-width:78%;">
        <div class="rname" style="font-weight:500; font-size:13.5px;">${q.case}</div>
        <div class="rmeta">เฉลย: ${(q.options||OPTIONS_DEFAULT)[q.correct]}</div>
      </div>
      <button class="ghost small" data-del="${q.id}">ลบ</button>
    </div>
  `).join('') || '<div class="small-muted">หัวข้อนี้ยังไม่มีคำถาม</div>';

  wrap.innerHTML = `
    <div class="card">
      <label style="margin-bottom:8px;">คำถามในหัวข้อ "${topicName}" (${questions.length} ข้อ)</label>
      ${qRows}
    </div>
    <div class="card">
      <label style="margin-bottom:10px;">เพิ่มคำถามใหม่ในหัวข้อนี้</label>
      <label for="qCase">เคส (Case)</label>
      <textarea id="qCase" placeholder="เช่น ชาย 65 ปี เจ็บแน่นหน้าอก..."></textarea>
      <label>ตัวเลือกและเฉลย</label>
      <div class="opt5" id="optWrap">
        ${OPTIONS_DEFAULT.map((o,i)=>`
          <div class="orow">
            <input type="radio" name="correctOpt" value="${i}" ${i===0?'checked':''}>
            <span class="oswatch" style="background:${LEVEL_COLORS[i]}"></span>
            <input type="text" class="optInput" value="${o}" style="flex:1;">
          </div>
        `).join('')}
      </div>
      <button class="primary" id="addQBtn">บันทึกคำถาม</button>
    </div>
  `;

  wrap.querySelectorAll('[data-del]').forEach(btn=>{
    btn.addEventListener('click', async ()=>{
      await deleteDoc(doc(db,'question_bank',selectedTopicId,'questions',btn.dataset.del));
      renderTopicDetail();
    });
  });

  document.getElementById('addQBtn').addEventListener('click', async ()=>{
    const caseText = document.getElementById('qCase').value.trim();
    const optionInputs = [...wrap.querySelectorAll('.optInput')].map(i=>i.value.trim());
    const correct = parseInt(wrap.querySelector('input[name=correctOpt]:checked').value,10);
    if(!caseText || optionInputs.some(o=>!o)) return;
    await addDoc(collection(db,'question_bank',selectedTopicId,'questions'), {
      case: caseText, options: optionInputs, correct, createdAt: serverTimestamp()
    });
    renderTopicDetail();
  });
}

function downloadTemplate(){
  const header = ['topic','case','option1','option2','option3','option4','option5','correct'];
  const sample = ['เจ็บหน้าอก','ชาย 65 ปี เจ็บแน่นหน้าอกร้าวไปแขนซ้าย BP 90/60','Level 1 (แดง)','Level 2 (ส้ม)','Level 3 (เหลือง)','Level 4 (เขียว)','Level 5 (ขาว)','1'];
  const csv = '\uFEFF' + [header,sample].map(r=>r.map(csvEscape).join(',')).join('\r\n');
  const blob = new Blob([csv], { type:'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href=url; a.download='question_template.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
}

function parseCSV(text){
  const rows = []; let i=0, field='', row=[], inQuotes=false;
  const pushField=()=>{row.push(field); field='';};
  const pushRow=()=>{pushField(); rows.push(row); row=[];};
  while(i<text.length){
    const c = text[i];
    if(inQuotes){
      if(c==='"'){ if(text[i+1]==='"'){ field+='"'; i+=2; continue; } inQuotes=false; i++; continue; }
      field+=c; i++; continue;
    } else {
      if(c==='"'){ inQuotes=true; i++; continue; }
      if(c===','){ pushField(); i++; continue; }
      if(c==='\r'){ i++; continue; }
      if(c==='\n'){ pushRow(); i++; continue; }
      field+=c; i++; continue;
    }
  }
  if(field.length || row.length) pushRow();
  return rows.filter(r => r.some(f=>f.trim()!==''));
}

function handleCsvFile(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = (ev)=>{
    const rows = parseCSV(ev.target.result);
    if(rows.length < 2){
      document.getElementById('csvPreviewWrap').innerHTML = `<div class="small-muted">ไม่พบข้อมูลในไฟล์</div>`;
      return;
    }
    const header = rows[0].map(h=>h.trim().toLowerCase());
    const idx = (name)=> header.indexOf(name);
    const cols = { topic:idx('topic'), case:idx('case'), o1:idx('option1'), o2:idx('option2'), o3:idx('option3'), o4:idx('option4'), o5:idx('option5'), correct:idx('correct') };
    if(Object.values(cols).some(v=>v===-1)){
      document.getElementById('csvPreviewWrap').innerHTML = `<div class="errtag">คอลัมน์ไม่ครบ ต้องมี: topic, case, option1-5, correct</div>`;
      return;
    }
    const valid = [], invalid = [];
    rows.slice(1).forEach((r,rowIdx)=>{
      const topic = (r[cols.topic]||'').trim();
      const caseText = (r[cols.case]||'').trim();
      const options = [r[cols.o1],r[cols.o2],r[cols.o3],r[cols.o4],r[cols.o5]].map(o=>(o||'').trim());
      const correctRaw = (r[cols.correct]||'').trim();
      const correctNum = parseInt(correctRaw,10);
      const errors = [];
      if(!topic) errors.push('ไม่มี topic');
      if(!caseText) errors.push('ไม่มี case');
      if(options.some(o=>!o)) errors.push('ตัวเลือกไม่ครบ 5 ข้อ');
      if(!(correctNum>=1 && correctNum<=5)) errors.push('correct ต้องเป็น 1-5');
      const entry = { rowIdx:rowIdx+2, topic, case:caseText, options, correct: correctNum-1, errors };
      if(errors.length===0) valid.push(entry); else invalid.push(entry);
    });
    csvPreview = { valid, invalid };
    renderCsvPreview();
  };
  reader.readAsText(file, 'UTF-8');
}

function renderCsvPreview(){
  const { valid, invalid } = csvPreview;
  const topicCounts = {};
  valid.forEach(v=> topicCounts[v.topic] = (topicCounts[v.topic]||0)+1);
  const summary = Object.entries(topicCounts).map(([t,c])=>`${t} (${c} ข้อ)`).join(', ');

  let rowsHtml = [...valid.map(v=>({...v, ok:true})), ...invalid.map(v=>({...v, ok:false}))]
    .sort((a,b)=>a.rowIdx-b.rowIdx)
    .map(v=>`
      <tr>
        <td>${v.rowIdx}</td>
        <td>${v.topic}</td>
        <td style="max-width:220px;">${v.case}</td>
        <td>${v.ok ? `<span class="oktag">OK</span>` : `<span class="errtag">${v.errors.join(', ')}</span>`}</td>
      </tr>
    `).join('');

  document.getElementById('csvPreviewWrap').innerHTML = `
    <div style="margin-top:14px;">
      <div class="small-muted" style="text-align:left;">พบ ${valid.length} ข้อที่ถูกต้อง (${summary || '-'})${invalid.length ? `, ${invalid.length} แถวมีปัญหา` : ''}</div>
      <div style="max-height:260px; overflow-y:auto; margin-top:8px;">
        <table><thead><tr><th>แถว</th><th>Topic</th><th>Case</th><th>สถานะ</th></tr></thead><tbody>${rowsHtml}</tbody></table>
      </div>
      <button class="primary" id="confirmImportBtn" style="margin-top:14px;" ${valid.length===0?'disabled':''}>ยืนยันนำเข้า ${valid.length} ข้อ</button>
    </div>
  `;
  document.getElementById('confirmImportBtn').addEventListener('click', confirmImport);
}

async function confirmImport(){
  const btn = document.getElementById('confirmImportBtn');
  btn.disabled = true; btn.textContent = 'กำลังนำเข้า...';
  const { valid } = csvPreview;

  const topicIdCache = {};
  for(const name of [...new Set(valid.map(v=>v.topic))]){
    const existing = await getDocs(query(collection(db,'question_bank'), where('name','==',name)));
    if(!existing.empty){ topicIdCache[name] = existing.docs[0].id; }
    else{
      const ref = await addDoc(collection(db,'question_bank'), { name, createdAt: serverTimestamp() });
      topicIdCache[name] = ref.id;
    }
  }

  const batch = writeBatch(db);
  valid.forEach(v=>{
    const topicId = topicIdCache[v.topic];
    const newRef = doc(collection(db,'question_bank',topicId,'questions'));
    batch.set(newRef, { case:v.case, options:v.options, correct:v.correct, createdAt: serverTimestamp() });
  });
  await batch.commit();

  document.getElementById('csvPreviewWrap').innerHTML = `<div class="oktag" style="display:block; margin-top:10px;">นำเข้าสำเร็จ ${valid.length} ข้อ</div>`;
  csvPreview = null;
  bankTopics = await fetchTopics();
}

function render(){
  if(!presenterAuthed){ renderGate(); return; }
  if(view === 'classrooms') renderClassroomsList();
  else if(view === 'classroom-new') renderClassroomNew();
  else if(view === 'classroom-control') renderRoom();
  else if(view === 'bank') renderBank();
}
